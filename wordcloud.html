<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madness Wall of Fame</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.2.2/wordcloud2.min.js"></script>
    <style>
        :root {
            --bg-dark: #0d1117;
            --accent-orange: #ff6600;
            --accent-turquoise: #4dffbc;
            --accent-purple: #a64dff;
        }

        body {
            margin: 0;
            background: var(--bg-dark);
            color: white;
            font-family: 'Oswald', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-y: auto;
            /* Allow scroll if content is too tall */
        }

        h1 {
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            background: linear-gradient(90deg, var(--accent-orange), var(--accent-purple));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #canvas-container {
            width: 80vw;
            /* Reduced width to reduce height (aspect ratio) */
            max-height: 60vh;
            /* Force limit height */
            /* Maintain 3:1 Aspect Ratio logic via height calc if needed,
                   but canvas intrinsic size will handle resolution */
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: radial-gradient(circle at center, #1a202c 0%, #000 100%);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            width: 100%;
            height: 100%;
            /* Fill container */
            object-fit: contain;
            /* Ensure it fits without distortion/crop */
            display: block;
        }

        .controls {
            margin-top: 15px;
            /* Reduced margin */
            display: flex;
            gap: 20px;
        }

        .btn {
            background: var(--accent-turquoise);
            color: #000;
            border: none;
            padding: 10px 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            border-radius: 5px;
            text-transform: uppercase;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid white;
            color: white;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            color: var(--accent-turquoise);
        }
    </style>
</head>

<body>

    <h1>Madness Wall of Fame</h1>

    <div id="canvas-container">
        <div class="loading" id="loader">Caricamento Nomi...</div>
        <!-- HIGH RES CANVAS FOR PRINT provided by JS -->
        <canvas id="cloud-canvas"></canvas>
    </div>

    <div class="controls">
        <button id="back-btn" class="btn btn-outline">Torna al Pixel Wall</button>
        <button id="download-btn" class="btn">Scarica Banner (HR)</button>
    </div>

    <script>
        const canvas = document.getElementById('cloud-canvas');
        const container = document.getElementById('canvas-container');
        const loader = document.getElementById('loader');

        // TARGET PRINT SIZE (Scale down for web view, but generate high res)
        // 3m x 1m @ efficient DPI (e.g. 3000px x 1000px base)
        // If we want good quality, 3000x1000 is decent for vector-like text or high-qual raster.
        const WIDTH = 3000;
        const HEIGHT = 1000;

        canvas.width = WIDTH;
        canvas.height = HEIGHT;

        async function initCloud() {
            try {
                // Fetch contributors
                const res = await fetch('wall-api.php?type=contributors');
                if (!res.ok) throw new Error("No data");
                const data = await res.json();
                // Data: [{ name: "Mario", amount: 10.5 }, ...]

                if (data.length === 0) {
                    // Even if empty, we want to show the specific Madness placeholder
                    // loader.textContent = "Nessun contributore ancora... Sii il primo!";
                    // Proceed with empty list to render default words
                }

                // Process Data for WordCloud
                // Format: [ [word, weight], [word, weight] ... ]
                // Normalize weight based on money
                let maxAmt = 0;
                data.forEach(d => { if (d.amount > maxAmt) maxAmt = d.amount; });

                // Base size logic:
                // Min size 15, Max size 80 (Significantly smaller than Title)
                const list = data.map(d => {
                    const norm = maxAmt > 0 ? (d.amount / maxAmt) : 1;
                    const size = 20 + (norm * 60);
                    return [d.name, size];
                });

                // Inject Central Words (RESIZED to fit 1000px height - Adjusted for Full Width)
                list.push(['MADNESS', 130]);
                list.push(['WE ARE', 90]);

                loader.textContent = "Generazione Banner...";

                // Ensure canvas is clear
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, WIDTH, HEIGHT);

                WordCloud(canvas, {
                    list: list,
                    gridSize: 15,
                    weightFactor: function (size) {
                        return size * (canvas.width / 1024); // Full Scale (1.0)
                    },
                    fontFamily: 'Oswald',
                    fontWeight: 'bold',
                    color: function (word, weight) {
                        // EXCLUSIVE TURQUOISE FOR TITLE
                        if (word === 'MADNESS' || word === 'WE ARE') return '#4dffbc';

                        // Random Colors for contributors (Excluding Turquoise)
                        const colors = ['#ffffff', '#e0e0e0', '#aaaaaa', '#ff6600', '#a64dff', '#ff4d4d', '#ffcc00'];
                        return colors[Math.floor(Math.random() * colors.length)];
                    },
                    backgroundColor: 'rgba(0,0,0,0)',
                    rotateRatio: 0.5,
                    rotationSteps: 2,
                    drawOutOfBound: false,
                    shrinkToFit: true,
                    shuffle: false
                });

                // Listen for finish on the main canvas
                canvas.addEventListener('wordcloudstop', () => {
                    loader.style.display = 'none';
                });

            } catch (e) {
                console.error(e);
                loader.textContent = "Errore caricamento dati.";
            }
        }

        // Download feature
        document.getElementById('download-btn').onclick = () => {
            const link = document.createElement('a');
            link.download = 'Madness_Wall_Of_Fame_Banner.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        };

        // Back button logic
        document.getElementById('back-btn').onclick = () => {
            // Check if inside an iframe
            if (window.self !== window.top) {
                window.parent.postMessage('closeWallModal', '*');
            } else {
                // If Full Page (e.g. after payment redirect)
                window.location.href = 'index.html';
            }
        };

        // Init with Font Check
        document.fonts.ready.then(() => {
            initCloud();
        });

    </script>
</body>

</html>
